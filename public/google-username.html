<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title data-i18n="doc.googleUsername">Pilih Username - Huzky.xyz</title>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-main">
    <div class="container">
      <div class="auth-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 15h2"/></svg>
        UangKu
      </div>
      <h1 data-i18n="auth.googleUsername.h1">Pilih username</h1>
      <p class="auth-sub" data-i18n="auth.googleUsername.sub">Satu langkah lagi — pilih username untuk akun barumu.</p>
      <form id="google-username-form" class="auth-form">
        <div class="form-group">
          <label for="username" data-i18n="auth.username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]+">
          <p class="auth-hint" data-i18n="auth.googleUsername.hint">3-32 karakter, hanya huruf, angka, dan underscore.</p>
        </div>
        <p id="auth-error" class="error-msg"></p>
        <button type="submit" data-i18n="auth.googleUsername.btn">Buat akun</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Huzky.xyz</p>
  </footer>

  <script src="auth.js"></script>
</body>
</html>
