<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title data-i18n="doc.login">Login - Huzky.xyz</title>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-main">
    <div class="container">
      <div class="auth-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 15h2"/></svg>
        UangKu
      </div>
      <h1 data-i18n="auth.login.h1">Login</h1>
      <p class="auth-sub" data-i18n="auth.login.sub">Masuk untuk melihat dasbor keuanganmu.</p>
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username" data-i18n="auth.username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="auth.password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <p class="auth-alt" style="margin:-6px 0 0;"><a href="/forgot-password">Lupa password?</a></p>
        <div id="turnstile-container"></div>
        <p id="auth-error" class="error-msg"></p>
        <button type="submit" data-i18n="auth.login.btn">Login</button>
      </form>
      <p class="auth-alt"><span data-i18n="auth.login.alt">Belum punya akun?</span> <a href="/register" data-i18n="auth.login.altLink">Daftar di sini</a></p>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Huzky.xyz</p>
  </footer>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
  <script src="auth.js"></script>
</body>
</html>
