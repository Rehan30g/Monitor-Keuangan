<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title data-i18n="doc.register">Daftar - Huzky.xyz</title>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-main">
    <div class="container">
      <div class="auth-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 15h2"/></svg>
        UangKu
      </div>
      <h1 data-i18n="auth.reg.h1">Daftar Akun</h1>
      <p class="auth-sub" data-i18n="auth.reg.sub">Buat akun baru untuk mulai mencatat keuangan.</p>
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="username" data-i18n="auth.username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]+">
        </div>
        <div class="form-group">
          <label for="email" data-i18n="auth.email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="auth.password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
        </div>
        <div id="turnstile-container"></div>
        <p id="auth-error" class="error-msg"></p>
        <button type="submit" data-i18n="auth.reg.btn">Daftar</button>
      </form>

      <div class="auth-divider" id="google-divider" data-i18n="auth.google.or" hidden>atau</div>
      <a href="/api/auth/google" class="google-btn" id="google-btn" hidden>
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span data-i18n="auth.google.register">Daftar dengan Google</span>
      </a>

      <p class="auth-alt"><span data-i18n="auth.reg.alt">Sudah punya akun?</span> <a href="/login" data-i18n="auth.reg.altLink">Login di sini</a></p>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Huzky.xyz</p>
  </footer>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
  <script src="auth.js"></script>
</body>
</html>
