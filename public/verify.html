<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Kode - Huzky.xyz</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-main">
    <div class="container">
      <div class="auth-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 15h2"/></svg>
        Monitor Keuangan
      </div>
      <h1 id="verify-title">Verifikasi Kode</h1>
      <p id="verify-desc" class="auth-sub">Masukkan kode 6 digit yang dikirim ke email kamu.</p>
      <form id="verify-form" class="auth-form">
        <div class="form-group">
          <label for="code">Kode Verifikasi</label>
          <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code">
        </div>
        <p id="auth-error" class="error-msg"></p>
        <button type="submit">Verifikasi</button>
      </form>
      <p class="auth-alt"><a href="#" id="resend-link">Kirim ulang kode</a></p>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Huzky.xyz</p>
  </footer>

  <script src="auth.js"></script>
</body>
</html>
