<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password - Huzky.xyz</title>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-main">
    <div class="container">
      <div class="auth-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 15h2"/></svg>
        UangKu
      </div>
      <h1>Reset Password</h1>
      <p class="auth-sub" id="reset-sub">Buat password baru untuk akunmu.</p>
      <form id="reset-form" class="auth-form">
        <div class="form-group">
          <label for="new-password">Password baru</label>
          <input type="password" id="new-password" name="newPassword" autocomplete="new-password" required minlength="8">
        </div>
        <div class="form-group">
          <label for="confirm-password">Konfirmasi password</label>
          <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password" required minlength="8">
        </div>
        <p id="auth-error" class="error-msg"></p>
        <button type="submit">Simpan Password Baru</button>
      </form>
      <p class="auth-alt"><a href="/login">Kembali ke login</a></p>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Huzky.xyz</p>
  </footer>

  <script src="auth.js"></script>
</body>
</html>
